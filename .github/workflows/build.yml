name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # O runner ja traz o Android SDK; so aceitamos as licencas (sem travar no prompt)
      - name: Aceitar licencas do SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK (debug)
        run: gradle assembleDebug

      - name: Renomear APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MeuDex-Launcher.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MeuDex-Launcher-v0.6
          path: MeuDex-Launcher.apk
