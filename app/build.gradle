plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dexcustom.desktop'
    compileSdk 34

    defaultConfig {
        applicationId "com.dexcustom.desktop"
        minSdk 26
        targetSdk 34
        versionCode 7
        versionName "0.5.2"
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
